name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend-and-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-check-evidence
          path: |
            artifacts/review-ui/
            artifacts/eink-*/browser/
          retention-days: 7
