[package]
name = "knoop"
version = "0.1.0"
description = "Local-first personal knowledge practice tool"
authors = ["Knoop"]
edition = "2021"

[lib]
name = "knoop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
