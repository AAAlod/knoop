def projectRoot = new File(settingsDir, '../..').canonicalFile
def lockText = new File(projectRoot, 'Cargo.lock').getText('UTF-8')
def tauriMatch = lockText =~ /(?m)^name = "tauri"\r?\nversion = "([^"]+)"/
if (!tauriMatch.find()) { throw new GradleException('Tauri version not found in Cargo.lock') }
def tauriVersion = tauriMatch.group(1)
def userHome = System.getenv('USERPROFILE') ?: System.getProperty('user.home')
def cargoHome = new File(System.getenv('CARGO_HOME') ?: new File(userHome, '.cargo').path)
def registry = new File(cargoHome, 'registry/src')
def androidProject = registry.listFiles()?.findResults { source ->
    def candidate = new File(source, "tauri-${tauriVersion}/mobile/android")
    candidate.isDirectory() ? candidate : null
}?.first()
if (androidProject == null) { throw new GradleException("Tauri Android project not found in ${registry}; run the Rust build first") }
include ':tauri-android'
project(':tauri-android').projectDir = androidProject
